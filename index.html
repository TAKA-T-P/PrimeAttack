<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>素数スピード</title>
<style>
:root{
  --bg:#10131a;
  --panel:#1c2130;
  --accent:#4caf50;
  --accent2:#42a5f5;
  --danger:#ff5252;
  --text:#f1f3f6;
  --sub:#9aa3b5;
  --lv1:#2e7d32;
  --lv2:#1565c0;
  --lv3:#e65100;
  --lv4:#c62828;
}
*{box-sizing:border-box;}
html,body{
  margin:0;padding:0;height:100%;
  background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
  overscroll-behavior:none;
  -webkit-tap-highlight-color:transparent;
}
button,input,select{font-family:inherit;}
.screen{
  position:fixed;inset:0;
  display:flex;
}
.hidden{display:none !important;}

/* ---------- Title screen ---------- */
#title-screen{
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
  overflow-y:auto;
  padding:calc(env(safe-area-inset-top) + 24px) 20px calc(env(safe-area-inset-bottom) + 24px);
  gap:10px;
  background:linear-gradient(160deg,#1a1440 0%,#2d1f72 55%,#160f38 100%);
}
.title-bg{
  position:absolute;inset:0;
  overflow:hidden;
  z-index:-1;
  pointer-events:none;
}
.title-bg-num{
  position:absolute;
  font-weight:800;
  white-space:nowrap;
  will-change:transform;
  animation-name:driftUp;
  animation-timing-function:linear;
  animation-iteration-count:infinite;
}
@keyframes driftUp{
  0%{transform:translate(0,0);}
  100%{transform:translate(55vw,-85vh);}
}
#title-screen h1{
  font-size:clamp(32px,9vw,46px);
  margin:0;
  letter-spacing:2px;
  font-weight:900;
  background:linear-gradient(90deg,#ff5252,#ffa726,#ffee58,#66bb6a,#42a5f5,#7e57c2,#ff5252);
  background-clip:text;
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  color:transparent;
}
#title-screen .subtitle{
  margin:0 0 8px;
  color:var(--sub);
  font-size:14px;
  letter-spacing:1px;
}
.sound-toggle-btn{
  position:absolute;
  top:calc(env(safe-area-inset-top) + 14px);
  right:16px;
  width:44px;height:44px;
  border-radius:50%;
  border:1px solid #2c3244;
  background:rgba(28,33,48,0.85);
  color:var(--text);
  font-size:20px;
  display:flex;align-items:center;justify-content:center;
  padding:0;
}
.sound-toggle-btn.muted{opacity:0.5;}
fieldset{
  width:100%;max-width:420px;
  border:1px solid #2c3244;
  border-radius:12px;
  padding:8px 16px 10px;
}
legend{padding:0 6px;color:var(--sub);font-size:13px;}
.btn-row{
  display:flex;gap:8px;flex-wrap:wrap;margin-top:2px;
}
.option-btn{
  flex:1;min-width:40px;
  padding:10px 4px;
  border-radius:10px;
  border:1px solid #2c3244;
  background:#12151f;
  color:var(--text);
  font-size:15px;font-weight:700;
  text-align:center;
}
.option-btn.selected{
  background:linear-gradient(135deg,var(--accent),#2e7d32);
  border-color:var(--accent);
  color:#fff;
}
.start-btn{
  width:100%;max-width:420px;
  padding:16px;border:none;border-radius:14px;
  background:linear-gradient(135deg,var(--accent),#2e7d32);
  color:#fff;font-size:20px;font-weight:700;letter-spacing:2px;
  margin-top:8px;
}
.start-btn:disabled{opacity:0.4;}
.warning{color:var(--danger);font-size:13px;margin:-6px 0 0;}

/* ---------- Game screen ---------- */
#game-screen{
  flex-direction:column;
  height:100dvh;width:100vw;
  padding-top:env(safe-area-inset-top);
  padding-bottom:env(safe-area-inset-bottom);
  overflow:hidden;
  position:relative;
  touch-action:none;
  user-select:none;
}
#board{
  flex:1;display:flex;flex-direction:column;
  max-width:600px;width:100%;margin:0 auto;
  min-height:0;
}
.player-zone{
  flex:0 0 auto;
  display:flex;flex-direction:column;
  gap:4px;padding:6px 10px;
  position:relative;
}
.lowstock-warning{
  position:absolute;top:-6px;left:50%;
  transform:translate(-50%,-100%);
  font-size:clamp(20px,7vw,30px);font-weight:800;
  color:#ffd54f;background:rgba(20,24,34,0.75);
  padding:4px 14px;border-radius:10px;
  opacity:0.9;white-space:nowrap;pointer-events:none;z-index:50;
  transition:opacity 1.2s ease;
}
.lowstock-warning.fade-out{opacity:0;}
.mistake-flash{
  position:absolute;inset:0;z-index:55;
  display:flex;align-items:center;justify-content:center;
  pointer-events:none;
  font-size:clamp(32px,11vw,52px);font-weight:800;
  color:#fff;text-shadow:0 3px 10px rgba(0,0,0,0.6);
  background:rgba(255,82,82,0.35);
  opacity:1;
  transition:opacity 0.5s ease;
}
.mistake-flash.fade-out{opacity:0;}
.rotated{transform:rotate(180deg);}
.status-bar{
  display:flex;align-items:center;justify-content:center;gap:10px;
  min-height:32px;
}
.message{
  font-size:clamp(12px,3.4vw,15px);color:var(--sub);
}
.remaining-row{
  display:flex;align-items:center;justify-content:center;gap:10px;
}
.remaining-label{
  text-align:center;font-size:11px;color:var(--sub);letter-spacing:0.5px;
}
.remaining-count{font-weight:800;font-size:2em;}
.declare-btn{
  padding:4px 10px;border-radius:20px;border:1px solid var(--accent2);
  background:transparent;color:var(--accent2);font-size:12px;
}
.declare-btn:disabled{opacity:0.3;border-color:#555;color:#777;}
.composite-row{
  display:flex;align-items:center;justify-content:center;gap:12px;
}
.composite-wrap{
  display:flex;flex-direction:column;align-items:center;gap:6px;
}
.used-col{
  display:flex;flex-direction:column;align-items:center;gap:6px;min-width:36px;max-height:240px;flex-wrap:wrap;
}
.used-chip{
  width:32px;height:32px;border-radius:50%;
  background:#333c50;color:#cfd6e6;font-size:20px;font-weight:700;
  display:flex;align-items:center;justify-content:center;
}
#p1-used .used-chip{background:#fafafa;color:#12151f;}
.hand-row{
  display:flex;justify-content:center;gap:clamp(4px,1.6vw,8px);
  min-height:44px;
}
.card{
  min-width:44px;min-height:44px;
  flex:1;max-width:64px;
  aspect-ratio:1/1.1;
  border-radius:10px;border:none;
  font-size:clamp(18px,6vw,26px);font-weight:700;
  display:flex;align-items:center;justify-content:center;
  touch-action:manipulation;
}
.p1-card{background:#fafafa;color:#12151f;}
.p2-card{background:#232a3c;color:#f1f3f6;border:1px solid #3a4258;}
.card.disabled{opacity:0.45;}
.card.cpu-card{opacity:1;}
@keyframes shake{
  0%,100%{transform:translateX(0);}
  20%{transform:translateX(-6px);}
  40%{transform:translateX(6px);}
  60%{transform:translateX(-4px);}
  80%{transform:translateX(4px);}
}
.card.shake{animation:shake 0.35s ease;background:var(--danger) !important;color:#fff !important;}
.card.empty-slot{background:transparent;border:2px dashed #3a4258;}

.center-area{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:6px;
  min-height:0;position:relative;
}
.composite-row{transition:transform 0.3s ease;}
.composite-row.rot90{transform:translateX(18vw) rotate(90deg);}
.composite-card{
  width:clamp(48px,15vw,75px);
  aspect-ratio:1/1.3;
  border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  font-size:clamp(15px,5vw,26px);font-weight:800;
  color:#fff;box-shadow:0 4px 14px rgba(0,0,0,0.4);
  background:#333;
}
.composite-card.level-1{background:linear-gradient(160deg,var(--lv1),#1b5e20);}
.composite-card.level-2{background:linear-gradient(160deg,var(--lv2),#0d47a1);}
.composite-card.level-3{background:linear-gradient(160deg,var(--lv3),#bf360c);}
.composite-card.level-4{background:linear-gradient(160deg,var(--lv4),#8e0000);}
.composite-label{
  font-size:12px;color:var(--sub);letter-spacing:1px;
}

#anim-layer{position:fixed;inset:0;pointer-events:none;z-index:500;}
.card-ghost{
  position:fixed;display:flex;align-items:center;justify-content:center;
  border-radius:10px;font-weight:700;font-size:22px;
  background:var(--accent);color:#fff;
  transition:transform 0.5s ease,opacity 0.5s ease;
}

.overlay{
  position:absolute;inset:0;z-index:400;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(0,0,0,0.6);gap:20px;
}
.overlay.hidden{display:none;}
@keyframes pop{from{transform:scale(0.5);opacity:0;}to{transform:scale(1);opacity:1;}}
#countdown-text{
  font-size:clamp(70px,22vw,150px);font-weight:800;color:#fff;
  text-shadow:0 4px 16px rgba(0,0,0,0.6);animation:pop 0.25s ease;
}
#round-overlay{background:transparent;}
.round-content{
  display:flex;flex-direction:column;align-items:center;gap:18px;
  transition:transform 0.3s ease;
  background:rgba(77,208,225,0.42);
  border:1px solid rgba(178,235,242,0.55);
  border-radius:22px;
  padding:32px 40px;
  box-shadow:0 8px 30px rgba(0,0,0,0.35);
  backdrop-filter:blur(3px);
  -webkit-backdrop-filter:blur(3px);
}
.round-content.rot90{transform:rotate(90deg);}
#round-title{font-size:clamp(18px,5vw,26px);font-weight:800;color:#fff;animation:pop 0.3s ease;}
#round-factors{font-size:clamp(18px,6vw,30px);font-weight:700;color:#fff;letter-spacing:1px;text-align:center;}

/* ---------- CPU character ---------- */
.cpu-character-block{
  display:flex;flex-direction:column;align-items:center;gap:8px;
  max-width:100%;
}
.cpu-character-emoji{
  font-size:clamp(72px,20vw,110px);
  line-height:1;
  font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
}
.cpu-character-name{
  font-weight:800;color:#fff;font-size:clamp(16px,4.5vw,22px);
  text-align:center;
}
.speech-bubble{
  position:relative;
  max-width:min(84vw,360px);
  background:rgba(255,255,255,0.94);
  color:#12151f;
  border-radius:14px;
  padding:10px 16px;
  font-size:clamp(13px,3.6vw,16px);
  font-weight:600;
  line-height:1.4;
  text-align:center;
  overflow-wrap:break-word;
  word-break:break-word;
}
.speech-bubble::after{
  content:'';
  position:absolute;
  top:-8px;left:50%;
  transform:translateX(-50%);
  border-left:8px solid transparent;
  border-right:8px solid transparent;
  border-bottom:8px solid rgba(255,255,255,0.94);
}
#round-character .cpu-character-emoji{font-size:clamp(44px,13vw,68px);}
#round-character .speech-bubble{font-size:clamp(12px,3.2vw,14px);padding:8px 14px;}
#character-intro-overlay{z-index:400;}
#char-intro-content{will-change:transform,opacity;}
@keyframes charBouncePop{
  0%{transform:scale(0.5);opacity:0;}
  60%{transform:scale(1.15);opacity:1;}
  100%{transform:scale(1);opacity:1;}
}
@keyframes charSlideIn{
  0%{transform:translateX(-60px);opacity:0;}
  100%{transform:translateX(0);opacity:1;}
}
@keyframes charFastFadeSlide{
  0%{transform:translateY(20px);opacity:0;}
  100%{transform:translateY(0);opacity:1;}
}
@keyframes charFloatFadeIn{
  0%{transform:translateY(16px);opacity:0;}
  100%{transform:translateY(0);opacity:1;}
}
@keyframes charZoomIn{
  0%{transform:scale(0.3);opacity:0;}
  100%{transform:scale(1);opacity:1;}
}
@keyframes charScreenShake{
  0%,100%{transform:translate(0,0);}
  20%{transform:translate(-4px,2px);}
  40%{transform:translate(4px,-2px);}
  60%{transform:translate(-3px,1px);}
  80%{transform:translate(3px,-1px);}
}
@keyframes charGlitchIn{
  0%{opacity:0;filter:brightness(2) saturate(0);transform:translateX(0);}
  15%{opacity:1;filter:brightness(1.5) saturate(0.5);transform:translateX(-3px);}
  30%{opacity:0.6;filter:brightness(1) saturate(1);transform:translateX(3px);}
  45%{opacity:1;transform:translateX(-2px);}
  60%{opacity:0.8;transform:translateX(2px);}
  100%{opacity:1;filter:none;transform:translateX(0);}
}
.char-anim-1{animation:charBouncePop 0.5s ease;}
.char-anim-2{animation:charSlideIn 0.4s ease;}
.char-anim-3{animation:charFastFadeSlide 0.3s ease;}
.char-anim-4{animation:charFloatFadeIn 0.6s ease;}
.char-anim-5{animation:charZoomIn 0.5s ease;}
.char-anim-max{animation:charGlitchIn 0.5s steps(2,end);}
.char-intro-shake{animation:charScreenShake 0.3s ease;}
@media (prefers-reduced-motion: reduce){
  .char-anim-1,.char-anim-2,.char-anim-3,.char-anim-4,.char-anim-5,.char-anim-max,.char-intro-shake{
    animation:none !important;
  }
}
#result-overlay{background:rgba(0,0,0,0.75);}
#result-text{font-size:clamp(40px,13vw,86px);font-weight:800;color:#fff;animation:pop 0.4s ease;text-align:center;}
.result-btn{
  padding:14px 26px;border:none;border-radius:12px;
  background:var(--panel);color:var(--text);font-size:16px;font-weight:700;
  border:1px solid #3a4258;
}
.result-btn-row{
  display:flex;gap:14px;flex-wrap:wrap;justify-content:center;
  max-width:min(92vw,420px);
}
.result-play-counts{text-align:center;}
.result-play-counts-title{
  font-size:clamp(12px,3.2vw,14px);color:var(--sub);margin-bottom:4px;
}
.result-play-counts-values{
  font-size:clamp(16px,4.4vw,20px);font-weight:700;color:#fff;
}

.pause-btn{
  position:absolute;top:calc(env(safe-area-inset-top) + 8px);right:10px;z-index:350;
  padding:6px 14px;border-radius:20px;border:1px solid #3a4258;
  background:rgba(28,33,48,0.85);color:var(--text);font-size:13px;
}
#pause-overlay{z-index:600;background:rgba(0,0,0,0.75);}
#pause-text{font-size:clamp(18px,5vw,24px);font-weight:700;color:#fff;text-align:center;padding:0 24px;}
</style>
</head>
<body>

<div id="title-screen" class="screen">
  <div id="title-bg" class="title-bg"></div>
  <button id="sound-toggle-btn" type="button" class="sound-toggle-btn" data-on="true">🔊</button>
  <h1>素数スピード</h1>
  <p class="subtitle">Prime Number Speed</p>

  <fieldset>
    <legend>モード選択</legend>
    <div class="btn-row">
      <button type="button" class="option-btn mode-btn selected" data-mode="single">CPU対戦</button>
      <button type="button" class="option-btn mode-btn" data-mode="local2p">2人対戦</button>
    </div>
  </fieldset>

  <fieldset id="cpu-level-fieldset">
    <legend>CPU強さ</legend>
    <div class="btn-row">
      <button type="button" class="option-btn cpu-level-btn" data-level="1">1</button>
      <button type="button" class="option-btn cpu-level-btn" data-level="2">2</button>
      <button type="button" class="option-btn cpu-level-btn selected" data-level="3">3</button>
      <button type="button" class="option-btn cpu-level-btn" data-level="4">4</button>
      <button type="button" class="option-btn cpu-level-btn" data-level="5">5</button>
      <button type="button" class="option-btn cpu-level-btn" data-level="MAX">MAX</button>
    </div>
  </fieldset>

  <fieldset>
    <legend>出題レベル（複数選択可）</legend>
    <div class="btn-row">
      <button type="button" class="option-btn level-toggle-btn selected" data-value="1">1</button>
      <button type="button" class="option-btn level-toggle-btn selected" data-value="2">2</button>
      <button type="button" class="option-btn level-toggle-btn" data-value="3">3</button>
      <button type="button" class="option-btn level-toggle-btn" data-value="4">4</button>
    </div>
  </fieldset>

  <button id="start-btn" class="start-btn">スタート</button>
  <p id="level-warning" class="warning hidden">出題レベルを1つ以上選択してください</p>
</div>

<div id="game-screen" class="screen hidden">
  <div id="anim-layer"></div>
  <button id="pause-btn" class="pause-btn hidden">ポーズ</button>
  <div id="board">
    <div id="top-zone" class="player-zone">
      <div id="p2-mistake-flash" class="mistake-flash hidden">お手つき！</div>
      <div id="p2-lowstock" class="lowstock-warning hidden">残り3枚！</div>
      <div id="p2-hand" class="hand-row"></div>
      <div class="remaining-row">
        <div id="p2-remaining" class="remaining-label"></div>
        <button id="p2-declare" class="declare-btn">パス</button>
      </div>
      <div class="status-bar">
        <div id="p2-message" class="message"></div>
      </div>
    </div>

    <div class="center-area">
      <div id="composite-row" class="composite-row">
        <div id="p1-used" class="used-col"></div>
        <div class="composite-wrap">
          <div id="composite-card" class="composite-card"></div>
          <div id="composite-label" class="composite-label"></div>
        </div>
        <div id="p2-used" class="used-col"></div>
      </div>
    </div>

    <div id="bottom-zone" class="player-zone">
      <div id="p1-mistake-flash" class="mistake-flash hidden">お手つき！</div>
      <div id="p1-lowstock" class="lowstock-warning hidden">残り3枚！</div>
      <div id="p1-hand" class="hand-row"></div>
      <div class="remaining-row">
        <div id="p1-remaining" class="remaining-label"></div>
        <button id="p1-declare" class="declare-btn">パス</button>
      </div>
      <div class="status-bar">
        <div id="p1-message" class="message"></div>
      </div>
    </div>
  </div>

  <div id="countdown-overlay" class="overlay hidden"><div id="countdown-text"></div></div>
  <div id="character-intro-overlay" class="overlay hidden">
    <div id="char-intro-content" class="cpu-character-block">
      <div id="char-intro-emoji" class="cpu-character-emoji"></div>
      <div id="char-intro-name" class="cpu-character-name"></div>
      <div class="speech-bubble"><div id="char-intro-line"></div></div>
    </div>
  </div>
  <div id="round-overlay" class="overlay hidden">
    <div id="round-content" class="round-content">
      <div id="round-title">ターン終了！</div>
      <div id="round-factors"></div>
      <div id="round-character" class="cpu-character-block hidden">
        <div id="round-char-emoji" class="cpu-character-emoji"></div>
        <div id="round-char-name" class="cpu-character-name"></div>
        <div class="speech-bubble"><div id="round-char-line"></div></div>
      </div>
      <button id="round-next-btn" class="result-btn">次へ</button>
    </div>
  </div>
  <div id="result-overlay" class="overlay hidden">
    <div id="result-text"></div>
    <div class="result-play-counts">
      <div class="result-play-counts-title">出したカードの枚数</div>
      <div id="result-play-counts-values" class="result-play-counts-values"></div>
    </div>
    <div id="result-character" class="cpu-character-block hidden">
      <div id="result-char-emoji" class="cpu-character-emoji"></div>
      <div id="result-char-name" class="cpu-character-name"></div>
      <div class="speech-bubble"><div id="result-char-line"></div></div>
    </div>
    <div class="result-btn-row">
      <button id="next-opponent-btn" class="result-btn hidden">次の相手と戦う</button>
      <button id="retry-btn" class="result-btn">もう一度</button>
      <button id="title-btn" class="result-btn">タイトルへ</button>
    </div>
  </div>
  <div id="pause-overlay" class="overlay hidden">
    <div id="pause-text">タイトル画面へ戻りますか？</div>
    <div style="display:flex;gap:14px;">
      <button id="pause-yes" class="result-btn">はい</button>
      <button id="pause-no" class="result-btn">いいえ</button>
    </div>
  </div>
</div>

<script>
'use strict';

/* ================= DATA ================= */
const PRIMES = [2,3,5,7,11];

const LEVEL_DECKS = {
  1: { cards:[27,14,70,35,45,18,12,10,42,20,49,30,28,15,25,21,6,8] },
  2: { cards:[90,196,147,40,140,36,126,105,98,225,150,210,60,84] },
  3: { cards:[735,484,605,441,1100,726,308,770,440,132,462,630,154,231,315,495,420,198,330,385] },
  4: { cards:[1980,2310,8470,5250,2520,1320,1782,10500,2646,5544,3234,1960,2156,2450,1089,2475,1540,1210,4950,3388] }
};

const CPU_LEVELS = {
  1:{minMs:3200,maxMs:5200,mistakeRate:0.22},

/* ================= UTIL ================= */
function shuffle(arr){
  const a = arr.slice();
  for (let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function factorize(n){
  const result = {};
  let value = n;
  for (const p of PRIMES){
    while (value % p === 0){
      result[p] = (result[p]||0)+1;
      value/=p;
    }
  }
  return result;
}
function factorsToString(n){
  const f = factorize(n);
  const parts = [];
  PRIMES.forEach(p=>{
    for (let i=0;i<(f[p]||0);i++) parts.push(p);
  });
  return n + '=' + parts.join('×');
}
function remainingTotal(){
  return Object.values(state.remainingFactors).reduce((a,b)=>a+b,0);
}
function hasLegalMove(playerId){
  const player = state.players[playerId];
  if (player.locked) return false;
  return player.hand.some(c => (state.remainingFactors[c]||0) > 0);
}
function hasPendingRefill(){
  return state.players.p1.hand.includes(null) || state.players.p2.hand.includes(null);
}

/* ================= CPU CHARACTER ================= */
function pickRandomMessage(messages){
  if (!messages || messages.length === 0) return '';
  return messages[Math.floor(Math.random()*messages.length)];
}
function getCpuCharacter(){
  return CPU_CHARACTERS[state.cpuLevel];
}
function getCpuLeadState(){
  const diff = state.cpuSuccessfulPlays - state.playerSuccessfulPlays;
  if (diff >= 5) return LEAD_STATE.CPU_BIG_LEAD;
  if (diff >= 3) return LEAD_STATE.CPU_LEAD;
  if (diff >= 1) return LEAD_STATE.CPU_SMALL_LEAD;
  if (diff === 0) return LEAD_STATE.EVEN;
  if (diff >= -2) return LEAD_STATE.PLAYER_SMALL_LEAD;
  if (diff >= -4) return LEAD_STATE.PLAYER_LEAD;
  return LEAD_STATE.PLAYER_BIG_LEAD;
}
function getCpuIntroMessage(){
  return pickRandomMessage(getCpuCharacter().intro);
}
function getCpuRoundMessage(){
  const ch = getCpuCharacter();
  return pickRandomMessage(ch.round[getCpuLeadState()]);
}
function getCpuGameOverMessage(cpuWon){
  const ch = getCpuCharacter();
  return pickRandomMessage(cpuWon ? ch.win : ch.lose);
}

/* ================= AUDIO ================= */
let audioCtx = null;
function ensureAudio(){
  if (!audioCtx){
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (Ctx) audioCtx = new Ctx();
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
function beep(freq, duration, type='sine', gain=0.15, delay=0){
  if (!state.soundOn || !audioCtx) return;
  const t0 = audioCtx.currentTime + delay;
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  osc.frequency.value = freq;
  osc.type = type;
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(gain, t0+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+duration);
  osc.connect(g); g.connect(audioCtx.destination);
  osc.start(t0); osc.stop(t0+duration+0.02);
}
function playSound(name){
  if (!state.soundOn) return;
  switch(name){
    case 'countdown': beep(440,0.15); break;
    case 'start': beep(880,0.3,'square'); break;
    case 'correct': beep(660,0.12); beep(880,0.1,'sine',0.12,0.08); break;
    case 'incorrect': beep(150,0.25,'sawtooth',0.18); break;
    case 'beaten': beep(520,0.1,'sine',0.12); beep(520,0.1,'sine',0.1,0.12); break;
    case 'roundTransition': beep(523,0.2); break;
    case 'tencount': beep(500,0.1); break;
    case 'tencountFinal': beep(700,0.25,'square'); break;
    case 'declare': beep(400,0.15,'triangle'); break;
    case 'win': beep(784,0.15); beep(988,0.15,'sine',0.15,0.15); beep(1175,0.25,'sine',0.15,0.3); break;
    case 'lose': beep(300,0.3,'sawtooth'); beep(220,0.4,'sawtooth',0.15,0.2); break;
    case 'cpuBossIntro': beep(200,0.15,'sawtooth',0.15); beep(150,0.2,'sawtooth',0.15,0.15); break;
    case 'cpuMaxIntro': beep(1200,0.05,'square',0.1); beep(1200,0.05,'square',0.1,0.08); beep(1200,0.08,'square',0.12,0.16); break;
  }
}

/* ================= DECK BUILDING ================= */
function buildCompositeDeck(){
  let all = [];
  state.cardLevelMap = {};
  state.selectedLevels.forEach(lv=>{
    LEVEL_DECKS[lv].cards.forEach(v=>{ all.push(v); state.cardLevelMap[v]=lv; });
  });
  state.compositeDeck = shuffle(all);
  state.compositeDiscard = [];
}
function computeCounts(){
  const includeHigh = state.selectedLevels.includes(3) || state.selectedLevels.includes(4);
  return includeHigh ? {2:6,3:5,5:4,7:4,11:4} : {2:6,3:5,5:4,7:4,11:0};
}
function buildPrimeDeck(counts){
  let cards = [];
  PRIMES.forEach(p=>{ for(let i=0;i<counts[p];i++) cards.push(p); });
  cards = shuffle(cards);
  cards.push('FINISH');
  return cards;
}
function makePlayer(counts){
  const deck = buildPrimeDeck(counts);
  const hand = deck.splice(0,5);
  return { hand, deck, locked:false, lockReason:null, declared:false, beatenMessageUntil:0 };
}

/* ================= ROUND / COMPOSITE FLOW ================= */
function nextComposite(){
  if (state.currentComposite !== null) state.compositeDiscard.push(state.currentComposite);
  if (state.compositeDeck.length === 0){
    state.compositeDeck = shuffle(state.compositeDiscard);
    state.compositeDiscard = [];
  }
  let next = state.compositeDeck.shift();
  const lastUsed = state.compositeDiscard[state.compositeDiscard.length-1];
  if (next === lastUsed && state.compositeDeck.length > 0){
    state.compositeDeck.push(next);
    next = state.compositeDeck.shift();
  }
  state.currentComposite = next;
  state.remainingFactors = factorize(next);
}

function checkRoundEnd(){
  if (state.phase !== 'PLAYING') return;
  if (remainingTotal() === 0){ beginRoundEnd(); return; }
  if (hasPendingRefill()) return;
  if (!hasLegalMove('p1') && !hasLegalMove('p2')){ beginRoundEnd(); return; }
}

function beginRoundEnd(){
  if (state.phase !== 'PLAYING') return;
  state.phase = 'ROUND_ENDING';
  state.inputLocked = true;
  clearCPUTimer();
  clearTenCountTimer();
  setTimeout(()=> triggerRoundTransition(), 1500);
}

function triggerRoundTransition(){
  if (state.phase !== 'ROUND_ENDING') return;
  state.phase = 'ROUND_TRANSITION';
  state.inputLocked = true;
  clearCPUTimer();
  clearTenCountTimer();
  playSound('roundTransition');
  document.getElementById('round-factors').textContent = factorsToString(state.currentComposite);
  document.getElementById('round-content').classList.toggle('rot90', state.mode === 'local2p');

  const charBlock = document.getElementById('round-character');
  if (state.mode === 'single'){
    const ch = getCpuCharacter();
    document.getElementById('round-char-emoji').textContent = ch.emoji;
    document.getElementById('round-char-name').textContent = ch.name;
    document.getElementById('round-char-line').textContent = getCpuRoundMessage();
    charBlock.classList.remove('hidden');
  } else {
    charBlock.classList.add('hidden');
  }

  document.getElementById('round-overlay').classList.remove('hidden');
  render();
}

function proceedToNextRound(){
  if (state.phase !== 'ROUND_TRANSITION') return;
  document.getElementById('round-overlay').classList.add('hidden');
  state.players.p1.locked = false; state.players.p1.lockReason = null; state.players.p1.declared = false; state.players.p1.beatenMessageUntil = 0;
  state.players.p2.locked = false; state.players.p2.lockReason = null; state.players.p2.declared = false; state.players.p2.beatenMessageUntil = 0;
  state.roundUsed = {p1:[],p2:[]};
  state.lastPlayed = {};
  state.tenCount = {active:false,remaining:10,declarer:null,intervalId:null};
  nextComposite();
  state.phase = 'PLAYING';
  state.inputLocked = false;
  render();
  if (state.mode === 'single') scheduleCPU();
}

function refillHandSlot(playerId, index){
  if (state.phase === 'GAME_OVER') return;
  const player = state.players[playerId];
  if (player.hand[index] !== null) return;
  const next = player.deck[0];
  if (next === undefined || next === 'FINISH'){
    render();
    endGame(playerId);
    return;
  }
  player.hand[index] = player.deck.shift();
  render();
  animateSlideIn(playerId, index);
  const remaining = player.deck.length - 1;
  if (remaining === 3) showLowStockWarning(playerId);
  if (state.phase === 'PLAYING') checkRoundEnd();
}

function endGame(winnerId){
  if (state.phase === 'GAME_OVER') return;
  state.phase = 'GAME_OVER';
  state.winner = winnerId;
  state.inputLocked = true;
  clearCPUTimer();
  clearTenCountTimer();
  document.getElementById('round-overlay').classList.add('hidden');
  if (state.mode === 'single'){
    playSound(winnerId === 'p1' ? 'win' : 'lose');
  } else {
    playSound('win');
  }
  render();
  setTimeout(()=> showResultScreen(winnerId), 900);
}

/* ================= 10-COUNT ================= */
function clearTenCountTimer(){
  if (state.tenCount.intervalId){ clearInterval(state.tenCount.intervalId); state.tenCount.intervalId = null; }
}
function declareTenCount(playerId){
  if (state.phase !== 'PLAYING' || state.inputLocked || state.tenCount.active) return;
  const player = state.players[playerId];
  player.locked = true;
  player.lockReason = 'declared';
  player.declared = true;
  playSound('declare');
  checkRoundEnd();
  if (state.phase !== 'PLAYING'){
    render();
    return;
  }
  state.tenCount.active = true;
  state.tenCount.remaining = 10;
  state.tenCount.declarer = playerId;
  render();
  state.tenCount.intervalId = setInterval(tickTenCount, 1000);
}
function tickTenCount(){
  state.tenCount.remaining--;
  if (state.tenCount.remaining >= 1 && state.tenCount.remaining <= 5){
    playSound(state.tenCount.remaining === 1 ? 'tencountFinal' : 'tencount');
  }
  if (state.tenCount.remaining <= 0){
    clearTenCountTimer();
    render();
    beginRoundEnd();
  } else {
    render();
  }
}

/* ================= CARD PLAY ================= */
function spawnGhost(el, type){
  const rect = el.getBoundingClientRect();
  const ghost = document.createElement('div');
  ghost.className = 'card-ghost';
  ghost.textContent = el.textContent;
  ghost.style.left = rect.left + 'px';
  ghost.style.top = rect.top + 'px';
  ghost.style.width = rect.width + 'px';
  ghost.style.height = rect.height + 'px';
  document.getElementById('anim-layer').appendChild(ghost);
  requestAnimationFrame(()=>{
    const cx = window.innerWidth/2 - (rect.left + rect.width/2);
    const cy = window.innerHeight/2 - (rect.top + rect.height/2);
    ghost.style.transform = `translate(${cx}px, ${cy}px) scale(0.55)`;
    ghost.style.opacity = '0';
  });
  setTimeout(()=> ghost.remove(), 520);
}

function animateBeatenBounce(el){
  const rect = el.getBoundingClientRect();
  const ghost = document.createElement('div');
  ghost.className = el.className;
  ghost.textContent = el.textContent;
  ghost.style.position = 'fixed';
  ghost.style.left = rect.left + 'px';
  ghost.style.top = rect.top + 'px';
  ghost.style.width = rect.width + 'px';
  ghost.style.height = rect.height + 'px';
  ghost.style.margin = '0';
  ghost.style.transition = 'transform 0.3s ease';
  document.getElementById('anim-layer').appendChild(ghost);
  el.style.visibility = 'hidden';

  const cx = window.innerWidth/2 - (rect.left + rect.width/2);
  const cy = window.innerHeight/2 - (rect.top + rect.height/2);
  requestAnimationFrame(()=>{
    ghost.style.transform = `translate(${cx}px, ${cy}px)`;
  });
  setTimeout(()=>{
    ghost.style.transform = 'translate(0,0)';
  }, 300);
  setTimeout(()=>{
    ghost.remove();
    el.style.visibility = '';
  }, 620);
}

function animateSlideIn(playerId, index){

function playCard(playerId, index){
  if (state.phase !== 'PLAYING' || state.inputLocked) return;
  if (Date.now() < state.actionLockUntil[playerId]) return;
  const player = state.players[playerId];
  if (player.locked) return;
  const prime = player.hand[index];
  if (prime === undefined || prime === null) return;
  state.actionLockUntil[playerId] = Date.now() + 120;

  const cardEl = document.querySelector(`.card[data-player="${playerId}"][data-index="${index}"]`);

  if ((state.remainingFactors[prime]||0) > 0){
    if (cardEl) spawnGhost(cardEl, 'correct');
    playSound('correct');
    state.remainingFactors[prime]--;
    state.roundUsed[playerId].push(prime);
    state.lastPlayed[prime] = { time: Date.now(), playerId };
    if (playerId === 'p1') state.playerSuccessfulPlays++; else state.cpuSuccessfulPlays++;
    player.hand[index] = null;
    render();
    if (state.phase === 'PLAYING') checkRoundEnd();
    setTimeout(()=> refillHandSlot(playerId, index), 1000);
    return;
  }

  const beatenBy = state.lastPlayed[prime];
  if (beatenBy && beatenBy.playerId !== playerId && (Date.now() - beatenBy.time) <= 1000){
    playSound('beaten');
    player.beatenMessageUntil = Date.now() + 1200;
    render();
    const beatenEl = document.querySelector(`.card[data-player="${playerId}"][data-index="${index}"]`);
    if (beatenEl) animateBeatenBounce(beatenEl);
    setTimeout(()=>{ render(); }, 1200);
    return;
  }

  playSound('incorrect');
  player.locked = true;
  player.lockReason = 'mistake';
  showMistakeFlash(playerId);
  checkRoundEnd();
  render();
  if (state.phase === 'PLAYING'){
    const newEl = document.querySelector(`.card[data-player="${playerId}"][data-index="${index}"]`);
    if (newEl){
      newEl.classList.add('shake');
      setTimeout(()=> newEl.classList.remove('shake'), 350);
    }
  }
}

/* ================= CPU ================= */
function clearCPUTimer(){
  if (state.cpuTimerId){ clearTimeout(state.cpuTimerId); state.cpuTimerId = null; }
}
function scheduleCPU(){
  clearCPUTimer();
  if (state.phase !== 'PLAYING' || state.players.p2.locked) return;
  const cfg = CPU_LEVELS[state.cpuLevel];
  const delay = cfg.minMs + Math.random()*(cfg.maxMs - cfg.minMs);
  state.cpuTimerId = setTimeout(cpuAct, delay);
}
function cpuAct(){
  state.cpuTimerId = null;
  if (state.phase !== 'PLAYING' || state.inputLocked) return;
  const player = state.players.p2;
  if (player.locked) return;
  const hand = player.hand;
  const legalIdx = [];
  const illegalIdx = [];
  hand.forEach((c,i)=>{
    if (c === null) return;
    if ((state.remainingFactors[c]||0) > 0) legalIdx.push(i); else illegalIdx.push(i);
  });
  const cfg = CPU_LEVELS[state.cpuLevel];

  let idx = null;
  if (legalIdx.length > 0 && (illegalIdx.length === 0 || Math.random() >= cfg.mistakeRate)){
    idx = legalIdx[Math.floor(Math.random()*legalIdx.length)];
  } else if (illegalIdx.length > 0){
    idx = illegalIdx[Math.floor(Math.random()*illegalIdx.length)];
  } else if (legalIdx.length > 0){
    idx = legalIdx[Math.floor(Math.random()*legalIdx.length)];
  }

  if (idx !== null) playCard('p2', idx);

  if (state.phase === 'PLAYING' && !state.players.p2.locked){
    scheduleCPU();
  }
}

/* ================= RENDER ================= */
function compositeLevelOf(v){ return state.cardLevelMap[v] || 1; }

function render(){
  renderHandRow('p1','p1-hand');
  renderHandRow('p2','p2-hand');
  renderComposite();
  renderUsed();
  renderRemaining();
  renderStatus();
}

function renderRemaining(){
  ['p1','p2'].forEach(pid=>{
    const player = state.players[pid];
    const count = Math.max(0, player.deck.length - 1);
    document.getElementById(pid + '-remaining').innerHTML = '山札 残り<span class="remaining-count">' + count + '</span>枚';
  });
}

function renderHandRow(playerId, containerId){
  const container = document.getElementById(containerId);
  const player = state.players[playerId];
  container.innerHTML = '';
  const isCpu = (playerId === 'p2' && state.mode === 'single');
  player.hand.forEach((val, idx)=>{
    const btn = document.createElement('button');
    btn.dataset.player = playerId;
    btn.dataset.index = idx;
    if (val === null){
      btn.className = 'card empty-slot';
      btn.disabled = true;
      container.appendChild(btn);
      return;
    }
    btn.className = 'card ' + (playerId === 'p1' ? 'p1-card' : 'p2-card') + (isCpu ? ' cpu-card' : '');
    btn.textContent = val;
    const disabled = state.phase !== 'PLAYING' || state.inputLocked || player.locked || isCpu;
    if (disabled) btn.classList.add('disabled');
    if (!isCpu){
      btn.addEventListener('pointerdown', (e)=>{ e.preventDefault(); playCard(playerId, idx); });
    }
    container.appendChild(btn);
  });
}

function renderComposite(){
  const el = document.getElementById('composite-card');
  const label = document.getElementById('composite-label');
  if (state.currentComposite == null){
    el.textContent = '';
    el.className = 'composite-card';
    label.textContent = '';
    return;
  }
  const lv = compositeLevelOf(state.currentComposite);
  el.textContent = state.currentComposite;
  el.className = 'composite-card level-' + lv;
  label.textContent = 'レベル' + lv;
}

function renderUsed(){
  ['p1','p2'].forEach(pid=>{
    const row = document.getElementById(pid + '-used');
    row.innerHTML = '';
    state.roundUsed[pid].forEach(p=>{
      const chip = document.createElement('div');
      chip.className = 'used-chip';
      chip.textContent = p;
      row.appendChild(chip);
    });
  });
}

function statusMessage(playerId){
  const player = state.players[playerId];
  if (player.beatenMessageUntil && Date.now() < player.beatenMessageUntil) return 'この数は先に出された!';
  if (state.tenCount.active && state.tenCount.declarer === playerId) return '10カウント宣言中';
  if (state.tenCount.active && state.tenCount.declarer !== playerId) return 'あと ' + state.tenCount.remaining;
  if (player.lockReason === 'mistake') return 'お手つき! 次のカードまで待とう';
  if (state.phase === 'GAME_OVER') return '';
  return '素数を出そう!';
}

function renderStatus(){
  document.getElementById('p1-message').textContent = statusMessage('p1');
  document.getElementById('p2-message').textContent = state.mode === 'single' ? '' : statusMessage('p2');

  const declareEnabled = state.phase === 'PLAYING' && !state.inputLocked && !state.tenCount.active;
  const p1Btn = document.getElementById('p1-declare');
  p1Btn.disabled = !declareEnabled;

  const p2Btn = document.getElementById('p2-declare');
  if (state.mode === 'single'){
    p2Btn.classList.add('hidden');
  } else {
    p2Btn.classList.remove('hidden');
    p2Btn.disabled = !declareEnabled;
  }

  document.getElementById('top-zone').classList.add('rotated');
  document.getElementById('composite-row').classList.toggle('rot90', state.mode === 'local2p');

  document.getElementById('pause-btn').classList.toggle('hidden', state.phase !== 'PLAYING');
}

/* ================= SCREEN / GAME FLOW ================= */
function showScreen(name){
  document.getElementById('title-screen').classList.toggle('hidden', name !== 'title');
  document.getElementById('game-screen').classList.toggle('hidden', name !== 'game');
}

function runStartCountdown(cb){
  const seq = ['3','2','1','START!'];
  const overlay = document.getElementById('countdown-overlay');
  const text = document.getElementById('countdown-text');
  overlay.classList.remove('hidden');
  let i = 0;
  function step(){
    text.textContent = seq[i];
    text.style.animation = 'none';
    void text.offsetWidth;
    text.style.animation = '';
    playSound(i === seq.length-1 ? 'start' : 'countdown');
    i++;
    if (i < seq.length){
      setTimeout(step, 700);
    } else {
      setTimeout(()=>{
        overlay.classList.add('hidden');
        cb();
      }, 800);
    }
  }
  step();
}

function clearCharacterIntroTimer(){
  if (state.characterIntroTimerId){ clearTimeout(state.characterIntroTimerId); state.characterIntroTimerId = null; }
}
function showCharacterIntro(cb){
  const ch = getCpuCharacter();
  const overlay = document.getElementById('character-intro-overlay');
  const content = document.getElementById('char-intro-content');
  document.getElementById('char-intro-emoji').textContent = ch.emoji;
  document.getElementById('char-intro-name').textContent = ch.name;
  document.getElementById('char-intro-line').textContent = getCpuIntroMessage();
  content.className = 'cpu-character-block ' + ch.animClass;
  overlay.classList.remove('char-intro-shake');
  void overlay.offsetWidth;
  if (state.cpuLevel === 5) overlay.classList.add('char-intro-shake');
  overlay.classList.remove('hidden');
  if (state.cpuLevel === 5) playSound('cpuBossIntro');
  if (state.cpuLevel === 'MAX') playSound('cpuMaxIntro');
  state.characterIntroTimerId = setTimeout(()=>{
    overlay.classList.add('hidden');
    state.characterIntroTimerId = null;
    cb();
  }, 1800);
}

function syncSettingsFromUI(){
  state.mode = document.querySelector('.mode-btn.selected').dataset.mode;
  const cpuLevel = document.querySelector('.cpu-level-btn.selected').dataset.level;
  state.cpuLevel = (cpuLevel === 'MAX') ? 'MAX' : parseInt(cpuLevel,10);
  state.selectedLevels = Array.from(document.querySelectorAll('.level-toggle-btn.selected')).map(el=>parseInt(el.dataset.value,10));
  state.soundOn = document.getElementById('sound-toggle-btn').dataset.on !== 'false';
}
function saveSettings(){
  try{
    localStorage.setItem('primeSpeedSettings', JSON.stringify({
      mode: state.mode, cpuLevel: state.cpuLevel,
      selectedLevels: state.selectedLevels, soundOn: state.soundOn
    }));
  }catch(e){}
}
function loadSettings(){
  try{
    const raw = localStorage.getItem('primeSpeedSettings');
    if (!raw) return;
    const s = JSON.parse(raw);
    if (s.mode){
      document.querySelectorAll('.mode-btn').forEach(b=> b.classList.toggle('selected', b.dataset.mode === s.mode));
    }
    if (s.cpuLevel !== undefined){
      document.querySelectorAll('.cpu-level-btn').forEach(b=>{
        const val = (b.dataset.level === 'MAX') ? 'MAX' : parseInt(b.dataset.level,10);
        b.classList.toggle('selected', val === s.cpuLevel);
      });
    }
    if (Array.isArray(s.selectedLevels)){
      document.querySelectorAll('.level-toggle-btn').forEach(b=>{
        b.classList.toggle('selected', s.selectedLevels.includes(parseInt(b.dataset.value,10)));
      });
    }
    if (typeof s.soundOn === 'boolean'){
      const btn = document.getElementById('sound-toggle-btn');
      btn.dataset.on = s.soundOn ? 'true' : 'false';
      btn.textContent = s.soundOn ? '🔊' : '🔇';
      btn.classList.toggle('muted', !s.soundOn);
    }
  }catch(e){}
}

function startGame(){
  syncSettingsFromUI();
  saveSettings();

  buildCompositeDeck();
  const counts = computeCounts();
  state.players.p1 = makePlayer(counts);
  state.players.p2 = makePlayer(counts);
  state.round = 1;
  state.roundUsed = {p1:[],p2:[]};
  state.lastPlayed = {};
  state.winner = null;
  state.currentComposite = null;
  state.remainingFactors = {};
  state.tenCount = {active:false,remaining:10,declarer:null,intervalId:null};
  state.playerSuccessfulPlays = 0;
  state.cpuSuccessfulPlays = 0;
  clearCPUTimer();
  clearTenCountTimer();
  clearCharacterIntroTimer();

  state.phase = 'START_COUNTDOWN';
  state.inputLocked = true;

  document.getElementById('result-overlay').classList.add('hidden');
  document.getElementById('round-overlay').classList.add('hidden');
  document.getElementById('pause-overlay').classList.add('hidden');
  document.getElementById('countdown-overlay').classList.add('hidden');
  document.getElementById('character-intro-overlay').classList.add('hidden');
  showScreen('game');
  render();

  const proceedToCountdown = ()=>{
    runStartCountdown(()=>{
      nextComposite();
      state.phase = 'PLAYING';
      state.inputLocked = false;
      render();
      if (state.mode === 'single') scheduleCPU();
    });
  };

  if (state.mode === 'single'){
    showCharacterIntro(proceedToCountdown);
  } else {
    proceedToCountdown();
  }
}

function showResultScreen(winnerId){
  const text = document.getElementById('result-text');
  const charBlock = document.getElementById('result-character');

  const opponentLabel = state.mode === 'single' ? 'CPU' : '2P';
  document.getElementById('result-play-counts-values').textContent =
    `1P：${state.playerSuccessfulPlays}枚　${opponentLabel}：${state.cpuSuccessfulPlays}枚`;

  if (state.mode === 'single'){
    text.textContent = winnerId === 'p1' ? '勝ち！' : '負け…';
    const cpuWon = winnerId === 'p2';
    const ch = getCpuCharacter();
    document.getElementById('result-char-emoji').textContent = ch.emoji;
    document.getElementById('result-char-name').textContent = ch.name;
    document.getElementById('result-char-line').textContent = getCpuGameOverMessage(cpuWon);
    charBlock.classList.remove('hidden');
  } else {
    text.textContent = (winnerId === 'p1' ? '1P' : '2P') + '勝ち';
    charBlock.classList.add('hidden');
  }

  const canAdvance = state.mode === 'single' && winnerId === 'p1' && NEXT_CPU_LEVEL[state.cpuLevel] !== undefined;
  document.getElementById('next-opponent-btn').classList.toggle('hidden', !canAdvance);

  document.getElementById('result-overlay').classList.remove('hidden');
}

function fightNextOpponent(){
  const next = NEXT_CPU_LEVEL[state.cpuLevel];
  if (next === undefined) return;
  document.querySelectorAll('.cpu-level-btn').forEach(b=>{
    const val = (b.dataset.level === 'MAX') ? 'MAX' : parseInt(b.dataset.level,10);
    b.classList.toggle('selected', val === next);
  });
  document.getElementById('result-overlay').classList.add('hidden');
  startGame();
}

function goToTitle(){
  clearCPUTimer();
  clearTenCountTimer();
  clearCharacterIntroTimer();
  state.phase = 'TITLE';
  document.getElementById('result-overlay').classList.add('hidden');
  document.getElementById('round-overlay').classList.add('hidden');
  document.getElementById('character-intro-overlay').classList.add('hidden');
  showScreen('title');
}

function openPauseMenu(){
  if (state.phase !== 'PLAYING') return;
  state.inputLocked = true;
  clearCPUTimer();
  clearTenCountTimer();
  document.getElementById('pause-overlay').classList.remove('hidden');
}
function resumeFromPause(){
  document.getElementById('pause-overlay').classList.add('hidden');
  state.inputLocked = false;
  if (state.mode === 'single') scheduleCPU();
  if (state.tenCount.active){
    state.tenCount.intervalId = setInterval(tickTenCount, 1000);
  }
}
function confirmPauseToTitle(){
  clearCPUTimer();
  clearTenCountTimer();
  document.getElementById('pause-overlay').classList.add('hidden');
  goToTitle();
}

/* ================= INIT ================= */
function initTitleBackground(){
  const bg = document.getElementById('title-bg');
  if (!bg) return;
  const pool = Object.values(LEVEL_DECKS).flatMap(lv => lv.cards);
  const COUNT = 28;
  for (let i=0;i<COUNT;i++){
    const el = document.createElement('span');
    el.className = 'title-bg-num';
    el.textContent = pool[Math.floor(Math.random()*pool.length)];
    const size = 14 + Math.random()*30;
    const duration = 18 + Math.random()*16;
    const delay = -Math.random()*duration;
    const alpha = 0.16 + Math.random()*0.26;
    el.style.left = Math.random()*100 + '%';
    el.style.top = Math.random()*100 + '%';
    el.style.fontSize = size.toFixed(0) + 'px';
    el.style.color = `rgba(196,181,253,${alpha.toFixed(2)})`;
    el.style.animationDuration = duration.toFixed(1) + 's';
    el.style.animationDelay = delay.toFixed(1) + 's';
    bg.appendChild(el);
  }
}
function updateLevelWarning(){
  const anyChecked = document.querySelectorAll('.level-toggle-btn.selected').length > 0;
  document.getElementById('level-warning').classList.toggle('hidden', anyChecked);
  document.getElementById('start-btn').disabled = !anyChecked;
}
function updateCpuFieldsetVisibility(){
  const selected = document.querySelector('.mode-btn.selected');
  const mode = selected ? selected.dataset.mode : 'single';
  document.getElementById('cpu-level-fieldset').classList.toggle('hidden', mode !== 'single');
}

document.addEventListener('DOMContentLoaded', ()=>{
  initTitleBackground();
  loadSettings();
  updateLevelWarning();
  updateCpuFieldsetVisibility();

  document.querySelectorAll('.mode-btn').forEach(btn=>{
    btn.addEventListener('pointerdown', (e)=>{
      e.preventDefault();
      document.querySelectorAll('.mode-btn').forEach(b=> b.classList.remove('selected'));
      btn.classList.add('selected');
      updateCpuFieldsetVisibility();
    });
  });
  document.querySelectorAll('.cpu-level-btn').forEach(btn=>{
    btn.addEventListener('pointerdown', (e)=>{
      e.preventDefault();
      document.querySelectorAll('.cpu-level-btn').forEach(b=> b.classList.remove('selected'));
      btn.classList.add('selected');
    });
  });
  document.querySelectorAll('.level-toggle-btn').forEach(btn=>{
    btn.addEventListener('pointerdown', (e)=>{
      e.preventDefault();
      btn.classList.toggle('selected');
      updateLevelWarning();
    });
  });
  document.getElementById('sound-toggle-btn').addEventListener('pointerdown', (e)=>{
    e.preventDefault();
    const btn = document.getElementById('sound-toggle-btn');
    const newOn = btn.dataset.on === 'false';
    btn.dataset.on = newOn ? 'true' : 'false';
    btn.textContent = newOn ? '🔊' : '🔇';
    btn.classList.toggle('muted', !newOn);
  });

  document.getElementById('start-btn').addEventListener('pointerdown', (e)=>{
    e.preventDefault();
    if (document.getElementById('start-btn').disabled) return;
    ensureAudio();
    startGame();
  });

  document.getElementById('p1-declare').addEventListener('pointerdown', (e)=>{
    e.preventDefault();
    declareTenCount('p1');
  });
  document.getElementById('p2-declare').addEventListener('pointerdown', (e)=>{
    e.preventDefault();
    declareTenCount('p2');
  });

  document.getElementById('retry-btn').addEventListener('pointerdown', (e)=>{
    e.preventDefault();
    ensureAudio();
    startGame();
  });
  document.getElementById('next-opponent-btn').addEventListener('pointerdown', (e)=>{
    e.preventDefault();
    ensureAudio();
    fightNextOpponent();
  });
  document.getElementById('title-btn').addEventListener('pointerdown', (e)=>{
    e.preventDefault();
    goToTitle();
  });

  document.getElementById('pause-btn').addEventListener('pointerdown', (e)=>{
    e.preventDefault();
    openPauseMenu();
  });
  document.getElementById('pause-yes').addEventListener('pointerdown', (e)=>{
    e.preventDefault();
    confirmPauseToTitle();
  });
  document.getElementById('pause-no').addEventListener('pointerdown', (e)=>{
    e.preventDefault();
    resumeFromPause();
  });

  document.getElementById('round-next-btn').addEventListener('pointerdown', (e)=>{
    e.preventDefault();
    proceedToNextRound();
  });
});
</script>
</body>
</html>
